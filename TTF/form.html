<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <title></title>
    <link rel="stylesheet" href="style.css">
    <body>
        <header>
           <div>
            <img src="Images/TTF LOGO.png" alt="logo" class="logo">
            </div>
            <div>
                <input type="checkbox" id="menu-toggler">
                <label for="menu-toggler" class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>

            <nav class="nav-tools">
                <a href="TTF.html">Go Back</a>
            </nav>
            </div> 
        </header>
        <section class="contact-section">
            <div class="contact-container">
                <h2>Send Us a Message</h2>
                <p>Fill in the form below and we
                     will get back to you.</p>
                     <form id="contact-form">
                     <div class="form-row">
                        <div class="form-group">
            <label for="first-name">FIRST NAME</label>
            <input type="text" id="first"
            placeholder="Enter your first name"
            required></input>
            <br>
            <br>
            <label for="last-name">LAST NAME</label>
            <input type="text" id="last"
            placeholder="Enter your last name"
            required></input>
            <br>
            <br>
            <label for="email">EMAIL</label>
            <input type="email" id="email"
            placeholder="Enter your email address"
            required></input>
            <br>
            <br>
            <label for="phone-number">PHONE NUMBER</label>
            <input type="tel" id="phone"
            placeholder="e.g. 08103684371"
            pattern="[0-9+\s\-]{10,15}"
            title="Enter a valid phone number (1 to 11 digits)"
            required></input>
            <br>
            <br>
            <label for="messi">MESSAGE</label>
            <input type="text" id="messi"
            placeholder="Write your message here..."
            required></input>
            <br>
            <br>
            <br>
            <button type="submit" class="send-btn">Send message</button>
            <p id="message"></p>
        </div>
        </div>
        </form>
    </section>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="script.js"></script>
</body>
</html>
